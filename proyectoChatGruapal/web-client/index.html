<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - Ice WebSocket</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Ice.js desde CDN - VERSIÓN CORREGIDA -->
    <script src="./node_modules/ice/lib/Ice.min.js"></script>
    <script src="./src/pages/Chat.js"></script> <!-- generado por slice2js -->
    <script src="./src/pages/ChatApp.js"></script>
</head>

<body>
    <div class="app">
        <!-- SIDEBAR FOR CONTACTS AND GROUPS -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                    ChatApp
                </div>
                <button id="createGroupBtn" class="icon-btn" title="Create new group">
                    <i class="fas fa-users"></i>
                </button>
            </header>

            <div class="search-box">
                <div class="search-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" class="search-input" placeholder="Search or start a new chat...">
                </div>
            </div>

            <div id="contacts" class="contacts-list">
                <div class="contact" style="justify-content: center; padding: 20px;">
                    <span style="color: var(--text-muted);">Conectando al servidor...</span>
                </div>
            </div>
        </aside>

        <!-- MAIN CHAT AREA -->
        <main class="main">
            <header id="chatHeader" class="chat-header">
                <div class="chat-header-info">
                    <div class="chat-header-text">
                        <h2 class="chat-title">Select a chat</h2>
                        <span class="chat-subtitle">Your message history will appear here</span>
                    </div>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" title="Voice Call"><i class="fas fa-phone"></i></button>
                </div>
            </header>

            <div id="messages" class="messages">
                <div class="messages-placeholder">
                    <i class="fas fa-comment-dots"></i>
                    <p>Messages you send and receive will be shown here.</p>
                </div>
            </div>

            <!-- MESSAGE COMPOSER AREA -->
            <div class="composer">
                <div class="input-container" id="normalInput">
                    <input id="messageInput" type="text" class="message-input" placeholder="Type a message..." />
                    <button class="icon-btn mic-btn" title="Record voice note"><i
                            class="fas fa-microphone"></i></button>
                    <button id="sendBtn" class="send-btn" title="Send"><i class="fas fa-paper-plane"></i></button>
                </div>

                <div class="input-container recording" id="recordingInput" style="display: none;">
                    <button class="icon-btn cancel-btn" title="Cancel"><i class="fas fa-times"></i></button>
                    <div class="recording-indicator"></div>
                    <span class="recording-time">00:00</span>
                    <div class="recording-waveform">
                        <div class="recording-bar"></div>
                        <div class="recording-bar"></div>
                        <div class="recording-bar"></div>
                        <div class="recording-bar"></div>
                        <div class="recording-bar"></div>
                        <div class="recording-bar"></div>
                        <div class="recording-bar"></div>
                    </div>
                    <button class="send-btn" title="Send voice note"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- MODAL FOR USERNAME INPUT -->
    <div class="modal-overlay active" id="usernameModal">
        <div class="modal">
            <div class="modal-header">
                <h3>
                    <i class="fas fa-user-circle"></i>
                    Bienvenido a ChatApp
                </h3>
            </div>
            <div class="form-group">
                <label>Ingresa tu nombre de usuario</label>
                <input type="text" id="usernameInput" class="form-input" placeholder="Ej: Juan Pérez" autofocus
                    maxlength="30">
                <small style="color: var(--text-muted); font-size: 0.85rem; margin-top: 5px; display: block;">
                    Este nombre será visible para otros usuarios
                </small>
            </div>
            <button class="btn-primary" id="joinChatBtn">
                <i class="fas fa-sign-in-alt"></i> Unirse al Chat
            </button>
        </div>
    </div>

    <!-- MODAL FOR CREATING A GROUP -->
    <div class="modal-overlay" id="createGroupModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Create a new group</h3>
                <button class="modal-close"><i class="fas fa-times"></i></button>
            </div>
            <div class="form-group">
                <label>Group Name</label>
                <input type="text" id="groupNameInput" class="form-input" placeholder="e.g., Development Team">
            </div>
            <div class="form-group">
                <label>Select Participants</label>
                <div class="user-select-list" id="userSelectList">
                    <p class="placeholder-text">Available contacts to add to the group will appear here.</p>
                </div>
            </div>
            <button class="btn-primary" id="createGroupSubmit">
                <i class="fas fa-plus"></i> Create Group
            </button>
        </div>
    </div>

    <!-- Incluir el archivo JavaScript del chat (ya cargado en el head) -->
    <script>
        // Verificar que Ice se cargó correctamente
        if (typeof Ice === 'undefined') {
            console.error(' Ice no se cargó correctamente');
            alert('Error: No se pudo cargar la librería Ice. Verifica tu conexión a internet.');
        } else {
            console.log('✓ Ice cargado correctamente - Versión:', Ice.stringVersion());
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Voice recording UI logic - Ahora manejado completamente por ChatApp.js
            // No es necesario duplicar aquí, ChatApp.js ya maneja todo

            // Create group modal logic
            const createGroupBtn = document.getElementById('createGroupBtn');
            const createGroupModal = document.getElementById('createGroupModal');
            const closeModalBtns = document.querySelectorAll('.modal-close');

            createGroupBtn.addEventListener('click', async () => {
                if (!window.chatApp || !window.chatApp.currentUser) {
                    alert("Debes estar conectado para crear un grupo");
                    return;
                }

                try {
                    const users = await window.chatApp.chatService.getUsers();
                    renderUserSelectList(users);
                    createGroupModal.classList.add('active');
                } catch (error) {
                    console.error("Error obteniendo usuarios:", error);
                    alert("Error al cargar usuarios");
                }
            });

            closeModalBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    createGroupModal.classList.remove('active');
                });
            });

            createGroupModal.addEventListener('click', (e) => {
                if (e.target === createGroupModal) {
                    createGroupModal.classList.remove('active');
                }
            });

            // Submit group creation
            document.getElementById('createGroupSubmit').addEventListener('click', async () => {
                const groupNameInput = document.getElementById('groupNameInput');
                const groupName = groupNameInput.value.trim();

                if (!groupName) {
                    alert("Debes ingresar un nombre para el grupo");
                    return;
                }

                if (!window.chatApp || !window.chatApp.currentUser) {
                    alert("No estás conectado");
                    return;
                }

                try {
                    const group = await window.chatApp.chatService.createGroup(
                        groupName,
                        window.chatApp.currentUser.id
                    );

                    console.log("Grupo creado:", group);

                    const selectedUsers = document.querySelectorAll('#userSelectList input[type="checkbox"]:checked');
                    for (const checkbox of selectedUsers) {
                        await window.chatApp.chatService.joinGroup(group.id, checkbox.value);
                    }

                    alert("Grupo creado exitosamente: " + groupName);
                    createGroupModal.classList.remove('active');
                    groupNameInput.value = '';
                    // NUEVO: Forzar actualización inmediata de grupos
                    if (window.chatApp && window.chatApp.updateGroups) {
                        await window.chatApp.updateGroups();
                        console.log(" Lista de grupos actualizada");
                    }
                } catch (error) {
                    console.error("Error creando grupo:", error);
                    alert("Error al crear el grupo");
                }
            });
        });

        function renderUserSelectList(users) {
            const userSelectList = document.getElementById('userSelectList');
            userSelectList.innerHTML = '';

            if (!window.chatApp || !window.chatApp.currentUser) {
                userSelectList.innerHTML = '<p class="placeholder-text">No hay usuarios disponibles</p>';
                return;
            }

            const otherUsers = users.filter(user => user.id !== window.chatApp.currentUser.id);

            if (otherUsers.length === 0) {
                userSelectList.innerHTML = '<p class="placeholder-text">No hay otros usuarios conectados</p>';
                return;
            }

            otherUsers.forEach(user => {
                const userItem = document.createElement('div');
                userItem.className = 'user-select-item';

                const initial = user.username.charAt(0).toUpperCase();

                userItem.innerHTML = `
                    <input type="checkbox" value="${user.id}" id="user_${user.id}">
                    <div class="avatar-small">${initial}</div>
                    <label for="user_${user.id}">
                        <span class="username">${user.username}</span>
                        <span class="user-status ${user.isOnline ? 'online' : 'offline'}">
                            ${user.isOnline ? 'En línea' : 'Desconectado'}
                        </span>
                    </label>
                `;

                userSelectList.appendChild(userItem);
            });
        }
    </script>
</body>

</html>
